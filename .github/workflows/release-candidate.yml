name: Starter release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-validation:
    uses: ./.github/workflows/deep-validation.yml

  package-candidate:
    needs: deep-validation
    runs-on: ubuntu-latest
    environment: starter-package-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm packages:pack-check -- --manifest package-release-manifest.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-release-candidate-${{ github.sha }}
          path: package-release-manifest.json
          if-no-files-found: error
          retention-days: 30
