name: Deep starter validation

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  deep-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the full repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.22.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prove scanner policies block synthetic findings
        run: pnpm security:policy-test

      - name: Run the deep validation gate
        run: pnpm validate:deep

      - name: Upload deep-validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: starter-deep-validation-evidence
          path: .artifacts
          if-no-files-found: error
          retention-days: 30
